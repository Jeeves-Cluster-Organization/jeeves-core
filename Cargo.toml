[package]
name = "jeeves-core"
version = "0.0.2"
edition = "2021"
rust-version = "1.75"
authors = ["Jeeves Team"]
description = "Small in-process workflow runtime for deterministic and LLM-backed actions"
license = "Apache-2.0"

[lib]
name = "jeeves_core"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
futures = "0.3"
genai = "0.5"
serde_json = "1.0"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.11", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
large_enum_variant = "warn"
large_stack_arrays = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
